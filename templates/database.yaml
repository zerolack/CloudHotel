AWSTemplateFormatVersion: '2010-09-09'
Description: CloudHotel Database Infrastructure

Parameters:
  EnvironmentName:
    Type: String
    Default: CloudHotel

  VPC:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID from network stack

  PrivateSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet 1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet 2

  DBUsername:
    Type: String
    Default: admin

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8

Resources:
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MySQL access for CloudHotel application
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-Database-SG"
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: CloudHotel private database subnet group
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-DBSubnetGroup"
  HotelDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-Database"
      Engine: mysql
      EngineVersion: "8.0"
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      MultiAZ: false
      PubliclyAccessible: false
      StorageType: gp3
      BackupRetentionPeriod: 0
Outputs:
  DatabaseEndpoint:
    Description: RDS MySQL database endpoint
    Value: !GetAtt HotelDatabase.Endpoint.Address

  DatabasePort:
    Description: RDS MySQL database port
    Value: !GetAtt HotelDatabase.Endpoint.Port
